# 测试入口与标记注册。没有这个文件时，"N/N 通过"是没人能复现的口说白话。
[pytest]
testpaths = tests
# PR CI 默认跳过 slow（真实 MILP/全流程，分钟级）；nightly 全量：pytest -m ""
addopts = -m "not slow" -q
markers =
    slow: 真实 MILP 求解/全流程测试，分钟级（PR CI 默认跳过，nightly 全量跑）
    unit: 秒级单元测试
    eval: agent 行为评测（读 evals/cases.yaml，与 tests/ 的功能测试分开计量）
    # repro（P1.8）：跑真 MILP 复算 README 的 5 个 headline 数字，约 60 s。
    # 它**同时**带 slow——所以本机 `pytest` 与 PR 的 fast-tests 都不会跑它，
    # 但 CI 里另有一条 `repro-tests` job 专门跑 `pytest -m repro`。
    # 为什么要有这条专线：`-m "not slow"` 让默认通道对"物理常数改了"完全瞎，
    # 实测把 soc_min 0.20→0.15，快档 300 项全绿、只有 slow 4 项报红。
    # 现在常数本身已由 tests/test_physics_constants.py 在快档钉住（改一个数就红），
    # 这条专线补的是**另一半**：常数没动、但求解器换版导致结果漂移时也有人看见。
    repro: 复现 README headline 数字的真 MILP 回归（约 60 s，PR CI 有专线）
# 说明：命令行再给一个 -m 会**覆盖**上面 addopts 里的 -m（pytest 取最后一个），
# 所以 `pytest -m repro` 确实只跑带 repro 标记的用例，不需要 -o addopts=。
filterwarnings =
    # 🟢#50：PuLP v4.0 将改 API（LpVariable 构造 → prob.add_variable），当前版本产生海量
    # DeprecationWarning 淹没日志。此处收敛为不显示，迁移工作列入后续（见修复报告）。
    ignore::DeprecationWarning:pulp.*
