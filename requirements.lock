# ==============================================================================
# 汐储 TideShift · 完整依赖锁文件（直接依赖 + 传递依赖）
# ------------------------------------------------------------------------------
# 用途：把整棵依赖树的每个包钉到具体版本，供 CI / 生产环境逐版本复现。
# 安装：pip install -r requirements.lock

# 生成方式：以「实测精确版本」为输入跑一次完整解析，再取解析结果落盘：
#     pip install --dry-run --report report.json -r <实测精确 pin 文件>
#   直接依赖区块的版本随后与实测 pin 逐条校验一致（校验脚本见仓库维护记录）。
# 生成环境：Python 3.13.14 · Windows 10 · 索引 mirrors.cloud.tencent.com/pypi/simple
# 生成日期：2026-09-16 · 共 76 个包（直接依赖 20 + 传递依赖 56）

# 为什么不含 hash：
#   本项目跨平台（Windows / Linux / macOS）。pip 的 hash 校验要求为每个平台的每个 wheel
#   单独记录 hash，锁文件会膨胀数倍且无法跨平台使用。如需 hash 级校验，请在目标平台生成：
#       pip download -r requirements.txt -d ./wheels
#       pip hash ./wheels/*  （或使用 pip-tools: pip-compile --generate-hashes）

# 维护约定：
#   1. 直接依赖区块的版本必须与 requirements.txt 的下界保持一致；
#   2. 传递依赖区块由解析结果生成，请勿手工修改；
#   3. 更新锁文件后必须重跑 pytest（快测 + 全量），并更新下方「实测结果」。

# 实测结果（2026-09-20，1.1.0 电价日历改版）：
#   依赖树本次未改动，跑的是同一套 pin。
#   快测 244 项通过 —— 本机 Python 3.13.9 / Anaconda，75 ~ 93 s（`-m "not slow"`，244 passed + 33 deselected）。
#     时间几乎全在一处：`tests/test_chat_agent.py` 的 module 级 fixture 真跑一次
#     `run_daily_scheduling`，实测 65.3 s（其中 MILP 求解占满），它给该文件 20 项测试共用。
#     上一版这里记的是「215 项 / 57 s」——变慢了，但**没有归因**：新口径的电价曲线让分支搜索
#     变长是最可能的解释，本轮没有回头测旧数据下的同一 fixture，所以不下结论。
#   全量 277 项通过 —— 本机同一环境，832 s（`pytest -o addopts= -q`，含 33 项 slow）。
#     ⚠️ 1.1.0 还没在 CI 上跑过全量：CI 才是发版标准口径，本机数字只是改动过程中的自查。
#     最近一次 CI 全量仍是上一版的 247 项 / 846 s（Run 35446508669，workflow_dispatch @ e3df672，
#     ubuntu-latest / Python 3.13；846 s 是当时"pytest 与 coverage 各跑一遍"布局下的单步实测，
#     重复的那一遍后来已合并，所以它是那次运行的实测、不是当前布局的预测值）。
#     1.1.0 推上去后需重新 workflow_dispatch 一次，并把该 Run 的编号与计时回填到这里。
#   计数自查：pytest -o addopts= -q --collect-only -m "" | tail -1
