# ==============================================================================
# 汐储 TideShift · 完整依赖锁文件（直接依赖 + 传递依赖）
# ------------------------------------------------------------------------------
# 用途：把整棵依赖树的每个包钉到具体版本，供 CI / 生产环境逐版本复现。
# 安装：pip install -r requirements.lock

# 生成方式：以「实测精确版本」为输入跑一次完整解析，再取解析结果落盘：
#     pip install --dry-run --report report.json -r <实测精确 pin 文件>
#   直接依赖区块的版本随后与实测 pin 逐条校验一致（校验脚本见仓库维护记录）。
# 生成环境：Python 3.13.14 · Windows 10 · 索引 mirrors.cloud.tencent.com/pypi/simple
# 生成日期：2026-09-16 · 共 76 个包（直接依赖 20 + 传递依赖 56）

# 为什么不含 hash：
#   本项目跨平台（Windows / Linux / macOS）。pip 的 hash 校验要求为每个平台的每个 wheel
#   单独记录 hash，锁文件会膨胀数倍且无法跨平台使用。如需 hash 级校验，请在目标平台生成：
#       pip download -r requirements.txt -d ./wheels
#       pip hash ./wheels/*  （或使用 pip-tools: pip-compile --generate-hashes）

# 维护约定：
#   1. 直接依赖区块的版本必须与 requirements.txt 的下界保持一致；
#   2. 传递依赖区块由解析结果生成，请勿手工修改；
#   3. 更新锁文件后必须重跑 pytest（快测 + 全量），并更新下方「实测结果」。

# 实测结果（2026-09-20，1.1.0 电价日历改版）：
#   依赖树本次未改动，跑的是同一套 pin。
#
#   CI 口径（标准口径：GitHub Actions ubuntu-latest / Python 3.13.15，commit c4d220c）：
#     快测 244 项通过 —— push 触发 Run 35478561322，`244 passed, 33 deselected in 50.45 s`，
#       整个 job 含装依赖 92 s。
#     全量 277 项通过 —— workflow_dispatch Run 35486570178，整个 job 851 s，
#       其中 `coverage run -m pytest -m ""` 那一步占 805 s（03:27:13.98 → 03:40:38.67，含 coverage
#       插桩），报表 TOTAL 6650 stmts / 1217 miss = **82%**。
#       ⚠️ 这次拿不到 pytest 自己的"N passed in Xs"汇总行：那一步的命令里写了 `-q`，而 pytest.ini
#       的 addopts 已经带了一个 `-q`，两个叠加等于 `-qq`，pytest 把汇总行连同样吞了——277 这个数
#       是数四行进度点的圆点（72×3 + 61）确认的，全绿无一失败。已在 ci.yml 去掉重复的 `-q`，
#       该修复**尚未推上去**，所以下一次 dispatch 起才有自报计时。
#     与上一版对照：CI 的 846 s（Run 35446508669）是"pytest 与 coverage 各跑一遍"布局下
#       `pytest -m ""` 的单步实测，重复的那一遍后来已合并；本次 805 s 是合并后布局的实测。
#
#   本机口径（Python 3.13.9 / Anaconda，改动过程中的自查）：
#     快测 244 项 68 ~ 93 s（三次实测 67.7 / 75.5 / 92.8 s）；全量 277 项 832 s 全绿（`pytest -o addopts= -q`）。
#     本机快测明显慢于 CI，时间几乎全在一处：`tests/test_chat_agent.py` 的 module 级 fixture
#     真跑一次 `run_daily_scheduling`，实测 65.3 s（MILP 占满），给该文件 20 项测试共用。
#     上一版这里记的是「215 项 / 57 s」——变慢了，但**没有归因**：本轮没有回头测旧数据下的
#     同一 fixture，所以不下结论。
#
#   计数自查：pytest -o addopts= -q --collect-only -m "" | tail -1
