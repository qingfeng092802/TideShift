# ==============================================================================
# 汐储 TideShift · 打包元数据与工具链配置
# ------------------------------------------------------------------------------
# 为什么现在才有这个文件：此前全仓只有 requirements*.txt 与 pytest.ini，
# 项目既不可安装（无 pyproject.toml / setup.py），也没有任何静态检查配置
# （ruff / mypy / pre-commit 零命中）。这两条是"工程素养"最容易被扣分的项。
#
# ── 与 requirements*.txt 的关系（重要，别把它当成第二套口径）───────────────
# requirements.txt / requirements.lock / requirements-dev.txt 仍是**面向使用者的
# 安装入口**，README 的「安装」一节与 CI 都引用它们，不搬家。
# 本文件的 [project.dependencies] 是同一份约束的**机器可读镜像**，供
# `pip install -e .` 与依赖解析工具使用。
# 两者不许漂移 —— tests/test_packaging.py 逐条比对包名与版本区间，
# 任何一边改了另一边没跟就会红。这比"两处都写、靠人记得同步"可靠。
#
# ── 支持哪种安装方式 ──────────────────────────────────────────────────────────
# 支持：pip install -e .        （开发安装；可执行文件与数据/前端资源都留在仓库里）
# 不支持：pip install .         （非 editable 安装会把包放进 site-packages，
#                              而 web/ 与 data/ 是按 __file__ 相对项目根解析的
#                              运行期资源，装进 site-packages 后服务起不来。
#                              本项目是**应用**不是库，这里如实说明，不假装能装。）
# ==============================================================================
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tideshift"
# 版本号唯一事实来源 = src/__init__.py 的 __version__（README「代码约定」一节
# 明确写了这一条）。此处用 dynamic 引用它，而不是再抄一个数字 —— 抄一份就是
# 又一处"改了这边忘了那边"，而这次连测试都发现不了（打包元数据不参与运行）。
dynamic = ["version"]
description = "工商业储能峰谷套利与需求响应多智能体优化系统"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "qingfeng092802" }]
keywords = ["energy-storage", "milp", "optimization", "fastapi", "llm-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # 与 requirements.txt 逐条对应（版本区间必须一致，由 test_packaging.py 钉住）
    "numpy>=2.5.1,<3.0",
    "pandas>=3.0.5,<4.0",
    "scipy>=1.18.1,<2.0",
    "pulp>=3.3.2,<4.0",
    "highspy>=1.15.1,<1.16",
    "xgboost>=3.4.1,<4.0",
    "scikit-learn>=1.9.0,<2.0",
    "langgraph>=1.2.10,<1.3",
    "langchain>=1.3.14,<1.4",
    "langchain-core>=1.5.3,<1.6",
    "langchain-openai>=1.4.1,<1.5",
    "fastapi>=0.141.1,<1.0",
    "uvicorn>=0.52.1,<1.0",
    "pydantic>=2.13.4,<3.0",
    "python-multipart>=0.0.32,<0.1",
    "cryptography>=49.0.0,<50.0",
    "openpyxl>=3.1.5,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "coverage>=7.16.0,<8.0",
    "httpx>=0.28.1,<1.0",
    "ruff>=0.12.0,<1.0",
    # mypy 钉 <2.0：裸 `>=1.17.1` 会让 CI 装到 2.x，而 2.x 新开了 var-annotated
    # 这类检查，1.x 合法的写法在 2.x 报错。详见 requirements-dev.txt 的说明。
    "mypy>=1.17.1,<2.0",
]

[project.scripts]
# 与 README 里的 `python backend/server.py` 等价，只是不必先 cd 到项目根。
tideshift = "backend.server:main"
# 与 `python -m backend.manage` 等价（口令恢复 / 状态查看）。
tideshift-manage = "backend.manage:main"

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.packages.find]
# 只装这三个包；tests/ 不是发行物的一部分，tools/ 无 __init__.py 自动排除。
include = ["src*", "backend*", "evals*"]

# ==============================================================================
# ruff —— 静态检查与 import 排序
# ------------------------------------------------------------------------------
# 规则集是**逐个挑的**，不是"全开"：全开会在一个 1.7 万行的既有代码库上
# 一次报出上千条，结果只能整体 ignore，等于没配。
# 这里只启用"能立刻全绿、且真有价值"的部分，并写清每条为什么在。
#
# 已启用：
#   E4/E7/E9 —— import 相关问题、语句结构、语法级错误（默认集）
#   E501     —— 行长上限 120。本仓 99.5 分位是 104 字符，120 是"能守住的上限"，
#               不是随手填的数；超限的 20 行已逐行折行修掉。
#   F        —— pyflakes：未使用导入/变量、f-string 无占位符（真会藏 bug）
#   W        —— 空白相关问题（当前 0 命中，留着防回归）
#   I        —— import 排序（isort 规则，可自动修复）
#   B        —— flake8-bugbear：except 里 raise 不带 from、可变默认参数等
#   C4       —— 不必要的 dict()/list() 包装
#
# 刻意未启用（附理由，免得后人以为是漏了）：
#   UP  —— pyupgrade 会要求 215 处 `Dict[...]` → `dict[...]`、57 处
#          `Optional[X]` → `X | None`。这是纯风格迁移，改动面覆盖全仓每个文件，
#          与本次修复（缺陷）混在一起会让 diff 无法审查。留作独立一笔。
#   ARG —— 未使用参数。接口回调（progress_cb / 工具函数签名）本就要求占位。
#   PT  —— pytest 风格。69 处复合断言是既有测试的写法，改写没有行为收益。
#   SIM —— 化简建议。多数是"多个 with 合成一个"这类偏好，非缺陷。
# ==============================================================================
[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["web/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "W", "I", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# backend/server.py 必须在**任何项目内导入之前**把项目根与 backend/ 挂上
# sys.path，否则 `python backend/server.py` 会抛 ModuleNotFoundError（Python 只把
# 脚本所在目录加进 sys.path，不加 CWD）。这个顺序不是随手写的，见该文件第 8-13 行。
# 同一理由适用于 backend/manage.py（它把 backend/ 挂上 sys.path 后以模块名 `auth`
# 导入，确保与 server.py 拿到同一个模块对象而非并存的 backend.auth 副本）。
#
# B008：FastAPI 的 File(...) / Depends(...) 写在默认值里是框架要求的写法，不是笔误。
"backend/server.py" = ["E402", "B008"]
"backend/manage.py" = ["E402"]

# ==============================================================================
# mypy —— 类型检查
# ------------------------------------------------------------------------------
# 作用域刻意收在 src/（含子包），理由：
#   · src/ 是算法与模型的所在，类型错误在那里代价最高；
#   · backend/server.py 有 60 条存量告警，多数来自 FastAPI 装饰器与动态属性，
#     一次全修会把本次修复的 diff 淹没。留作独立一笔（见 README 待办）。
# `ignore_missing_imports`：pulp / highspy 等第三方包不提供完整类型存根，
# 不忽略的话告警全是"这个包没有存根"，与我们的代码质量无关。
# ==============================================================================
[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true

# pytest 配置**不放在这里**：pytest.ini 是既有的唯一所有者（README 与 CI 都
# 引用它，且带中文注释说明 slow 标记的分工）。两个文件都写会让"到底哪个生效"
# 变成一个需要查文档的问题 —— pytest 的优先级是 pytest.ini > pyproject.toml。
